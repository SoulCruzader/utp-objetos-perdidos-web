# CI - Integración continua
# Verifica cada cambio que llega a develop (y cada Pull Request hacia develop o main):
# revisión de código (lint), pruebas con umbral de cobertura y compilación.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Un cambio nuevo en la misma rama o Pull Request cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: este flujo solo necesita leer el código.
permissions:
  contents: read

jobs:
  verificar:
    name: CI - Verificar código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Valores ficticios: CI nunca usa claves reales (las reales solo existen en CD).
    env:
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: clave-ficticia-solo-para-ci
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js (versión definida en .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Revisar el código (lint)
        run: npm run lint

      - name: Ejecutar las pruebas con cobertura
        run: npm run test:coverage

      - name: Compilar la aplicación (build)
        run: npm run build

      - name: Guardar el reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reporte-de-cobertura
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
