# Dependabot - actualizaciones automáticas de dependencias y de acciones.
# Los Pull Requests se abren hacia develop, donde el flujo CI los verifica.
version: 2
updates:
  # Paquetes de npm (React, Vite, Supabase, etc.)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencias-de-desarrollo:
        dependency-type: development
        patterns:
          - '*'

  # Versiones de las acciones usadas en .github/workflows
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Lima
    commit-message:
      prefix: ci
